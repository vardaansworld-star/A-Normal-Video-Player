<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#1a1a1a;font-family:Georgia,'Times New Roman',serif;overflow:hidden}
.stage{position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center}
.frame{position:relative;width:640px;max-width:90vw;background:#232323;border:1px solid #3a3a3a;padding:18px}
.frame:before{
    content:'';
    position:absolute;
    top:-1px;
    left:-1px;
    right:-1px;
    bottom:-1px;
    border:1px solid #151515;
    pointer-events: none
}
.label{
    color:#8a8a8a;
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:10px;
}
.screen{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border:1px solid 333;
    overflow:hidden;
}
.screen video{
    width: 100%;
    height:100%;
    object-fit:cover;
    display:block
}

.menu{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#0c0c0c;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}
.menu .title{
    color:#5c5c5c;
    font-size:11px;
    letter-spacing:6px;
    text-transform:uppercase;
    margin-bottom:22px;
}

.startbtn{
    position:relative;
    padding:14px 46px;
    background:#1c1c1c;
    border:1px solid #4a4a4a;
    color:#c9c9c9;
    font-family:inherit;
    font-size:15px;
    letter-spacing:4px;
    text-transform:uppercase;
    cursor:pointer;
    outline:none;
}
.startbtn:before{
    content:'';
    position:absolute;
    top:4px;
    left:4px;
    right:4px;
    bottom:4px;
    border:1px solid #333;
    pointer-events:none;
}
.startbtn:hover{
    color:#f0f0f0;
    border-color:#8a8a8a;
}
.startbtn:active{
    transform:translateY(1px);
}

.blink{
    margin-top:16px;
    color:#4a4a4a;
    font-size:10px;
    letter-spacing:2px;
    animation:pulse 1.4s infinite;
}

@keyframes pulse{
    0%{opacity:.2}
    50%{opacity:.9}
    100%{opacity:.2}
}

.meta{
    margin-top:12px;
    display:flex;
    justify-content:space-between;
    color:#6d6d6d;
    font-size:11px;
}
.meta span{opacity:.8}

.controls{
    margin-top:14px;
    display:none;
    align-items:center;
    gap:10px;
}
.controls.show{display:flex}
.controls button{
    background: #2a2a2a;
    border:1px solid#3d3d3d;
    color:#aaa;
    font-size:11px;
    padding:6px 10px;
    cursor:pointer;
    font-family: iherit;
}
.controls button:hover{color:#ddd; border-color:#555}
.bar{
    flex:1;
    height:2px;
    background:#3a3a3a;
    position:relative;
    cursor:pointer;
}
.bar i{
    position:absolute;
    left:0;
    top:0;
    height:100%;
    background:#888;
    width:0%;
}

.time{color:#666;font-size:10px;min-width:74px;text-align:right}
</style>
</head>

</html>
